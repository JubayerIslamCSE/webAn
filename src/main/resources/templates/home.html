<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Collection Quest</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<header>
    <h1>Collection Quest</h1>
    <nav>
    <span th:if="${loggedInUser == null}">
        <a href="/login">Login</a>
        <a href="/signup">Sign Up</a>
    </span>
        <span th:if="${loggedInUser != null}">
        <span th:if="${isAdmin}"><a href="/admin">Admin Panel</a></span>
        <a href="/logout">Logout</a>
    </span>
    </nav>
</header>

<div class="anime-grid">
    <div class="anime-card" th:each="anime : ${animes}">
        <a th:href="@{/anime/{id}(id=${anime.id})}">
            <img th:src="${anime.imageUrl}" th:alt="${anime.title}">
            <div class="anime-card-info">
                <h3 th:text="${anime.title}">Title</h3>
                <p th:text="${anime.totalEpisodes} + ' Episodes'">Episodes</p>
            </div>
        </a>
    </div>
</div>

<footer>
    <div class="footer-content">
        <div class="footer-info">
            <p class="footer-name">MD Jubayer Islam</p>
            <p class="footer-id">Batch: 63</p>
            <p class="footer-project">Collection Quest — Anime Tracker</p>
        </div>
        <div class="footer-links">
            <a href="https://www.facebook.com/md.jubayer.islam.otul/" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://www.linkedin.com/in/md-jubayer-islam/" target="_blank"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/JubayerIslamCSE" target="_blank"><i class="fab fa-github"></i></a>
        </div>
    </div>
    <div class="footer-bottom">
        <p>© 2026 Collection Quest. Built with Spring Boot.</p>
    </div>
</footer>

</body>
</html>
